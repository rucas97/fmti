<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMTI — Coming Soon</title>
  <style>
    :root {
      --navy: #0a1e2e;
      --teal: #3ab0d0;
      --bg-color: #f8fafc; /* Very light, clean gray-blue */
      --text-main: #0a1e2e;
      --text-muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo - No white box, sits directly on the light background */
    .logo-wrapper {
      margin-bottom: 40px;
      display: flex;
      justify-content: center;
    }

    .logo-img {
      max-width: 100%;
      height: auto;
      max-height: 100px;
      display: block;
    }

    /* Minimalist Badge */
    .status-badge {
      display: inline-block;
      background: rgba(58, 176, 208, 0.1);
      color: #258ca8;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }

    /* Clean Typography */
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 20px;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 400;
      margin-bottom: 24px;
    }

    /* Subtle Divider */
    .divider {
      width: 60px;
      height: 3px;
      background: var(--teal);
      margin: 0 auto 24px auto;
      border-radius: 2px;
    }

    .footer-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .logo-img { max-height: 70px; }
      .subtitle { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo without the box -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="FMTi Logo" class="logo-img">
    </div>

    <div class="status-badge">Under Construction</div>

    <h1>Something Great<br>is Coming Soon</h1>
    
    <div class="divider"></div>

    <p class="subtitle">
      We are building the new digital home for the <br>
      <strong>Management Study and Tech Development Institute</strong>.
    </p>

    <div class="footer-text">FMTI</div>
  </div>

</body>
</html>
